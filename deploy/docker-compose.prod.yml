# Kaskad en production sur un serveur : API, console, MongoDB, MinIO (fichiers), ClamAV (antivirus)
# et Caddy (HTTPS automatique Let's Encrypt). Voir deploy/README.md.
#
# Les dépôts kaskad-backend et kaskad-console doivent être clonés côte à côte :
#   ~/kaskad/kaskad-backend   ~/kaskad/kaskad-console
#
#   cd kaskad-backend/deploy
#   cp .env.production.example .env.production   # puis remplir
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: kaskad

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?CONSOLE_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:?FILES_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, console, minio]

  api:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      PUBLIC_BASE_URL: https://${API_DOMAIN}
      CONSOLE_URL: https://${CONSOLE_DOMAIN}
      CORS_ORIGINS: '["https://${CONSOLE_DOMAIN}","kaskad://app"]'
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: kaskad
      MONGODB_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD}
      MONGODB_AUTH_SOURCE: admin
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: https://${FILES_DOMAIN}
      S3_BUCKET: kaskad
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCAN_REQUIRE_ANTIVIRUS: "true"
    volumes:
      # Facultatif : base GeoLite2 / DB-IP (GEOIP_DATABASE=/geoip/country.mmdb) pour les statistiques par pays
      - ./geoip:/geoip:ro
      # Facultatif : clés push (FIREBASE_CREDENTIALS_FILE=/secrets/firebase.json, APNS_KEY_FILE=/secrets/apns.p8)
      - ./secrets:/secrets:ro
    depends_on:
      mongo: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_started }

  console:
    build:
      context: ../../kaskad-console
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Images officielles MinIO plus distribuées publiquement : build maintenu par Chainguard (point d'entrée : minio)
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # Signatures mises à jour automatiquement (freshclam) ; premier démarrage : quelques minutes
    volumes: [clamav-data:/var/lib/clamav]

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  minio-data:
  clamav-data:
