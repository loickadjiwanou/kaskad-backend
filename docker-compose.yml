# Environnement complet : API + MongoDB + MinIO (stockage S3) + ClamAV (antivirus)
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_USERNAME: ${MONGODB_USERNAME:-kaskad}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-kaskad-mongo-secret}
      MONGODB_AUTH_SOURCE: admin
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: kaskad
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kaskad}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-kaskad-minio-secret}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on: [mongo, minio, clamav]
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Compte administrateur créé au premier démarrage (volume vide)
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-kaskad}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-kaskad-mongo-secret}
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

  minio:
    # Images officielles MinIO plus distribuées publiquement : build maintenu par Chainguard (point d'entrée : minio)
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kaskad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kaskad-minio-secret}
    volumes: [minio-data:/data]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes: [clamav-data:/var/lib/clamav]
    restart: unless-stopped

volumes:
  mongo-data:
  minio-data:
  clamav-data:
